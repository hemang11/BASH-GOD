<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
  <title id="title">BASH_GOD inline picker walkthrough</title>
  <desc id="desc">A fixture-only BASH_GOD terminal walkthrough. The operator moves to Show demo resource status, edits the native command with e, supplies a namespace, and sees fixture command output.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14120f"/>
      <stop offset="1" stop-color="#0a0b0c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff2c6"/>
      <stop offset=".38" stop-color="#f6c344"/>
      <stop offset="1" stop-color="#e58b2d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity=".48"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .dim { fill: #8d887e; }
      .quiet { fill: #c9c2b5; }
      .bright { fill: #f7f0e4; }
      .gold { fill: #f6c344; }
      .green { fill: #93d39b; }
      .orange { fill: #eaa05a; }
    </style>
  </defs>

  <rect width="1120" height="790" fill="#08090a"/>
  <rect x="48" y="38" width="1024" height="714" rx="16" fill="url(#backdrop)" stroke="#3a342b" filter="url(#shadow)"/>
  <path d="M48 82h1024" stroke="#3a342b"/>
  <circle cx="78" cy="60" r="6" fill="#ed6a5e"/>
  <circle cx="100" cy="60" r="6" fill="#f6c344"/>
  <circle cx="122" cy="60" r="6" fill="#6bbf70"/>
  <text x="560" y="66" text-anchor="middle" class="mono dim" font-size="14" letter-spacing="1.3">BASH_GOD · FIXTURE-ONLY WALKTHROUGH</text>

  <g class="mono">
    <text x="82" y="119" fill="url(#brand)" font-size="17" font-weight="700" letter-spacing="1.6">◆ BASH_GOD / DEMO SEARCH RESULTS</text>
    <text x="82" y="146" class="dim" font-size="15">Smart search: inspect resource</text>

    <rect x="82" y="172" width="956" height="94" rx="8" fill="#151719" stroke="#4c4538"/>
    <text x="108" y="207" class="quiet" font-size="16">Inspect a demo resource</text>
    <rect x="98" y="221" width="912" height="30" rx="4" fill="#2d2518"/>
    <rect x="98" y="221" width="4" height="30" rx="2" fill="#f6c344"/>
    <text x="118" y="242" class="gold" font-size="16" font-weight="700">❯ Show demo resource status</text>

    <text x="82" y="308" class="bright" font-size="16" font-weight="700">Show demo resource status</text>
    <text x="82" y="338" class="green" font-size="15">$ democtl status --namespace &lt;namespace&gt;</text>
    <text x="82" y="368" class="dim" font-size="14">↑/↓ move · e edit · enter run · esc cancel</text>

    <path d="M534 392v27" stroke="#6a5b3f" stroke-width="1.5" stroke-dasharray="4 5"/>
    <path d="M529 414l5 6 5-6" fill="none" stroke="#f6c344" stroke-width="1.5"/>
    <rect x="574" y="397" width="194" height="28" rx="14" fill="#211d16" stroke="#5b4b2b"/>
    <text x="671" y="416" text-anchor="middle" class="gold" font-size="13">e  edit in your shell</text>

    <rect x="82" y="448" width="956" height="244" rx="8" fill="#0d0f10" stroke="#353331"/>
    <text x="110" y="483" class="green" font-size="15">$ democtl status --namespace &lt;namespace&gt;</text>
    <text x="110" y="516" class="quiet" font-size="15">Namespace to inspect [&lt;namespace&gt;]:</text>
    <text x="522" y="516" class="gold" font-size="15">demo-team</text>
    <path d="M110 540h900" stroke="#2d302f"/>
    <text x="110" y="573" class="orange" font-size="13">DEMO CHILD STDERR: status query</text>
    <text x="110" y="611" class="dim" font-size="14">NAMESPACE   RESOURCE      STATUS</text>
    <text x="110" y="642" class="bright" font-size="15">demo-team   example-api   </text>
    <text x="380" y="642" class="green" font-size="15">ready</text>
    <text x="110" y="674" class="dim" font-size="13">Fixture only — no service, credentials, or local machine path contacted.</text>
  </g>
</svg>
